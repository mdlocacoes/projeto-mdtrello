<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - MD Tasks</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Estilo principal -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="landing-page">
  <div class="container">
    <h1><i class="fa-solid fa-user-plus"></i> Cadastro</h1>
    <p class="subtitle">Crie sua conta para começar a organizar suas tarefas com o MD Tasks</p>

    <form method="POST" action="/register" class="form-box">
      <input type="text" name="username" placeholder="Usuário" required />
      <input type="password" name="password" placeholder="Senha" required />
      <button type="submit" class="btn primary"><i class="fa-solid fa-check"></i> Cadastrar</button>
    </form>

    <div class="actions">
      <a href="login.html" class="btn secondary"><i class="fa-solid fa-right-to-bracket"></i> Já tenho conta</a>
      <a href="/" class="btn secondary"><i class="fa-solid fa-house"></i> Voltar</a>
    </div>
  </div>

  <script>
    // Detecta preferência de tema escuro
    if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
      document.body.classList.add("dark-mode");
    }

    // Exibe mensagem de erro se houver
    const params = new URLSearchParams(window.location.search);
    if (params.get("erro") === "1") {
      const msg = document.createElement("p");
      msg.textContent = "Usuário já existe. Escolha outro nome.";
      msg.style.color = "red";
      msg.style.marginTop = "1rem";
      document.querySelector(".form-box").appendChild(msg);
    }
  </script>
</body>
</html>
