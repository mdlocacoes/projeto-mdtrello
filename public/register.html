<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro - TO DO LIST</title>
  <meta name="description" content="Crie sua conta para organizar seus quadros pessoais estilo Trello" />
  <meta name="author" content="Bruno" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0077cc" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Tema -->
  <button onclick="toggleTheme()" class="theme-button">🌙 Tema</button>

  <!-- Avatar (se estiver logado) -->
  <div id="avatar">?</div>

  <header><h1>Mini Trello</h1></header>

  <main>
    <section class="login-section">
      <form id="registerForm">
        <h2>Cadastro</h2>
        <input type="text" id="newUsername" placeholder="Novo Usuário" required />
        <input type="password" id="newPassword" placeholder="Nova Senha" required />
        <button type="submit">Cadastrar</button>
      </form>
      <div id="registerStatus"></div>
    </section>
    <p style="text-align:center;">
      <a href="login.html">← Já tem conta? Faça login</a>
    </p>
  </main>

  <script>
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const theme = document.body.classList.contains("dark-mode") ? "dark" : "light";
      localStorage.setItem("theme", theme);
    }

    window.onload = () => {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") document.body.classList.add("dark-mode");

      fetch("/get-user")
        .then(res => res.json())
        .then(data => {
          if (data.username) {
            const avatar = document.getElementById("avatar");
            avatar.textContent = data.username.charAt(0).toUpperCase();
            avatar.title = data.username;
          } else {
            document.getElementById("avatar").style.display = "none";
          }
        });
    };

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("newUsername").value;
      const password = document.getElementById("newPassword").value;

      const res = await fetch("/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      const status = document.getElementById("registerStatus");
      status.textContent = data.message;
      status.style.color = data.success ? "green" : "red";

      if (data.success) {
        setTimeout(() => window.location.href = "board.html", 1000);
      }
    });
  </script>
</body>
</html>
