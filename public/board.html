<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Tasks - Quadro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="topbar">
    <div class="logo"><i class="fa-solid fa-layer-group"></i> MD Tasks</div>
    <button id="mobileMenuToggle" class="theme-button" title="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>

  <!-- Menu lateral mobile -->
  <aside id="mobileMenu" class="mobile-menu">
    <button onclick="toggleTheme()" class="btn secondary">Alternar tema</button>
    <div class="user-box">
      <span id="userName">Usuário</span>
      <button onclick="logout()" class="logout-button">Sair</button>
    </div>
    <select id="projectSelect"></select>
    <button onclick="createNewProject()" class="btn primary">+ Novo Quadro</button>
    <button onclick="renameProject()" class="btn secondary">Renomear</button>
    <button onclick="deleteProject()" class="btn secondary">Excluir</button>
  </aside>

  <div class="board">
    <div class="column" data-column="todo">
      <h2>A Fazer</h2>
      <div class="card-list" id="todo"></div>
      <button onclick="addCard('todo')">+ Adicionar Cartão</button>
    </div>

    <div class="column" data-column="in-progress">
      <h2>Em Progresso</h2>
      <div class="card-list" id="in-progress"></div>
      <button onclick="addCard('in-progress')">+ Adicionar Cartão</button>
    </div>

    <div class="column" data-column="done">
      <h2>Concluído</h2>
      <div class="card-list" id="done"></div>
      <button onclick="addCard('done')">+ Adicionar Cartão</button>
    </div>
  </div>

  <script>
    document.getElementById("mobileMenuToggle").onclick = () => {
      document.getElementById("mobileMenu").classList.toggle("open");
    };
  </script>
</body>
</html>
