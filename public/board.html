<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Tasks - Quadro</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- 🔵 Topbar com tema e menu -->
  <div class="topbar">
    <div class="logo"><i class="fa-solid fa-layer-group"></i> MD Tasks</div>
    <div class="user-section">
      <button onclick="toggleTheme()" class="theme-button" title="Tema"><i class="fa-solid fa-moon"></i></button>
      <button id="menuToggle" class="theme-button" title="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>

  <!-- 🍔 Menu lateral mobile -->
  <aside id="mobileMenu" class="mobile-menu">
    <button onclick="closeMenu()" class="btn secondary"><i class="fa-solid fa-xmark"></i> Fechar Menu</button>
    <div class="user-box">
      <span id="userName">Olá, Usuário</span>
      <button onclick="logout()" class="logout-button">Sair</button>
    </div>
    <select id="projectSelect">
      <option value="default">Projeto atual</option>
    </select>
    <button onclick="createNewProject()" class="btn primary">+ Novo Quadro</button>
    <button onclick="renameProject()" class="btn secondary">Renomear</button>
    <button onclick="deleteProject()" class="btn secondary">Excluir</button>
  </aside>

 <!-- 🔧 Scroll-zone agora fixo no rodapé -->
<div class="scroll-zone">
  <div id="board" class="board">
    <!-- colunas dinâmicas -->
  </div>

  <div class="floating-column-button">
    <input type="text" id="newColumnName" placeholder="Nova coluna" />
    <button onclick="addColumn()">➕</button>
  </div>
</div>

  <!-- ⚙️ Menu toggle e tema -->
  <script>
    document.getElementById("menuToggle").onclick = () => {
      document.getElementById("mobileMenu").classList.toggle("open");
    };
    function closeMenu() {
      document.getElementById("mobileMenu").classList.remove("open");
    }
  </script>

  <!-- 📦 Script principal -->
  <script src="script.js"></script>
</body>
</html>
