<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Tasks - Visual V2</title>
  <link rel="stylesheet" href="styles-v2.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- 🔵 Topbar -->
  <div class="topbar">
    <div class="logo"><i class="fa-solid fa-layer-group"></i> MD Tasks</div>
    <div class="user-section">
      <button onclick="toggleTheme()" class="theme-button" title="Tema"><i class="fa-solid fa-moon"></i></button>
      <button id="menuToggle" class="theme-button" title="Menu"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>

  <!-- 🍔 Menu lateral -->
  <aside id="mobileMenu" class="mobile-menu">
    <button onclick="closeMenu()" class="btn secondary"><i class="fa-solid fa-xmark"></i> Fechar</button>
    <div class="user-box">
      <span id="userName">Olá, Usuário</span>
      <button onclick="logout()" class="logout-button">Sair</button>
    </div>
    <select id="projectSelect"></select>
    <button onclick="createNewProject()" class="btn primary">+ Novo Quadro</button>
    <button onclick="renameProject()" class="btn secondary">Renomear</button>
    <button onclick="deleteProject()" class="btn secondary">Excluir</button>
  </aside>

  <!-- 📋 Colunas Kanban -->
  <main class="board">
    <div class="column" data-column="todo">
      <h2>A Fazer</h2>
      <div class="card-list" id="todo"></div>
      <button onclick="addCard('todo')" class="btn secondary">+ Adicionar Cartão</button>
    </div>

    <div class="column" data-column="in-progress">
      <h2>Em Progresso</h2>
      <div class="card-list" id="in-progress"></div>
      <button onclick="addCard('in-progress')" class="btn secondary">+ Adicionar Cartão</button>
    </div>

    <div class="column" data-column="done">
      <h2>Concluído</h2>
      <div class="card-list" id="done"></div>
      <button onclick="addCard('done')" class="btn secondary">+ Adicionar Cartão</button>
    </div>
  </main>

  <!-- ⚙️ Interações básicas -->
  <script>
    document.getElementById("menuToggle").onclick = () => {
      document.getElementById("mobileMenu").classList.toggle("open");
    };
    function closeMenu() {
      document.getElementById("mobileMenu").classList.remove("open");
    }
  </script>

  <!-- 🔧 Script principal (reutilizado) -->
  <script src="../script.js"></script>
</body>
</html>
