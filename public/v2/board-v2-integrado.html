<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Tasks - V2 Integrado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          minHeight: { '300': '300px' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-800 transition-colors duration-300">

  <!-- 🔷 Topbar -->
  <header class="flex justify-between items-center bg-gray-800 text-white px-4 py-3">
    <div class="flex items-center gap-2">
      <i class="fa-solid fa-layer-group text-lg"></i>
      <h1 class="font-semibold text-lg">MD Tasks</h1>
    </div>
    <div class="flex gap-3 items-center">
      <button onclick="toggleTheme()" class="hover:text-yellow-300"><i class="fa-solid fa-moon"></i></button>
      <button id="menuToggle" class="hover:text-green-300"><i class="fa-solid fa-bars"></i></button>
    </div>
  </header>

  <!-- 📱 Menu lateral -->
  <aside id="mobileMenu" class="fixed top-0 right-0 w-64 h-full bg-white dark:bg-gray-900 shadow-lg z-50 transform translate-x-full transition-transform duration-300">
    <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
      <span id="userName" class="font-semibold dark:text-white">Olá, Usuário</span>
      <button onclick="closeMenu()" class="hover:text-black dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="p-4 space-y-3">
      <select id="projectSelect" class="w-full border rounded p-2 text-sm dark:bg-gray-800 dark:text-white dark:border-gray-600"></select>
      <button onclick="createNewProject()" class="w-full bg-blue-500 text-white py-2 rounded">+ Novo Quadro</button>
      <button onclick="renameProject()" class="w-full bg-gray-200 dark:bg-gray-700 dark:text-white py-2 rounded">Renomear</button>
      <button onclick="deleteProject()" class="w-full bg-gray-200 dark:bg-gray-700 dark:text-white py-2 rounded">Excluir</button>
      <button onclick="logout()" class="w-full bg-red-500 text-white py-2 rounded mt-2">Sair</button>
    </div>
  </aside>

  <!-- 📋 Colunas Kanban -->
  <main class="grid grid-cols-1 md:grid-cols-3 gap-4 p-4">
    <section class="bg-white dark:bg-gray-800 rounded shadow p-3 flex flex-col min-h-[300px]" data-column="todo">
      <h2 class="text-lg font-semibold mb-2 dark:text-white">A Fazer</h2>
      <div class="card-list flex-grow" id="todo"></div>
      <button onclick="addCard('todo')" class="bg-gray-200 dark:bg-gray-700 dark:text-white py-2 rounded mt-2">+ Adicionar Cartão</button>
    </section>
    <section class="bg-white dark:bg-gray-800 rounded shadow p-3 flex flex-col min-h-[300px]" data-column="in-progress">
      <h2 class="text-lg font-semibold mb-2 dark:text-white">Em Progresso</h2>
      <div class="card-list flex-grow" id="in-progress"></div>
      <button onclick="addCard('in-progress')" class="bg-gray-200 dark:bg-gray-700 dark:text-white py-2 rounded mt-2">+ Adicionar Cartão</button>
    </section>
    <section class="bg-white dark:bg-gray-800 rounded shadow p-3 flex flex-col min-h-[300px]" data-column="done">
      <h2 class="text-lg font-semibold mb-2 dark:text-white">Concluído</h2>
      <div class="card-list flex-grow" id="done"></div>
      <button onclick="addCard('done')" class="bg-gray-200 dark:bg-gray-700 dark:text-white py-2 rounded mt-2">+ Adicionar Cartão</button>
    </section>
  </main>

  <!-- ⚙️ Scripts -->
  <script>
    const menu = document.getElementById("mobileMenu");
    document.getElementById("menuToggle").onclick = () => {
      menu.classList.remove("translate-x-full");
      menu.classList.add("translate-x-0");
    };
    function closeMenu() {
      menu.classList.remove("translate-x-0");
      menu.classList.add("translate-x-full");
    }
    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    let allProjects = {};
    let currentProject = "";

    document.addEventListener("DOMContentLoaded", async () => {
      await loadProjects();
      renderCards();
    });

    async function loadProjects() {
      try {
        const res = await fetch("/api/projects");
        const data = await res.json();
        allProjects = data;

        const select = document.getElementById("projectSelect");
        select.innerHTML = "";
        Object.keys(allProjects).forEach(key => {
          const option = document.createElement("option");
          option.value = key;
          option.textContent = allProjects[key].name || key;
          select.appendChild(option);
        });

        currentProject = Object.keys(allProjects)[0];
        select.value = currentProject;
        document.getElementById("userName").textContent = `Projeto: ${allProjects[currentProject].name}`;
      } catch (err) {
        console.error("Erro ao carregar projetos:", err);
      }
    }

    function renderCards() {
      const { cards } = allProjects[currentProject];
      const columns = {
        todo: document.getElementById("todo"),
        inProgress: document.getElementById("in-progress"),
        done: document.getElementById("done")
      };

      Object.keys(columns).forEach(column => {
        columns[column].innerHTML = "";
        const list = cards[column] || [];

        list.forEach(cardData => {
          const card = document.createElement("div");
          card.className = "border-l-4 p-3 mb-2 rounded shadow-sm bg-white dark:bg-gray-700 text-gray-800 dark:text-white";

          const icons = [];
          if (cardData.date) icons.push("<i class='fa-solid fa-calendar-days text-blue-500'></i>");
          if (cardData.comment) icons.push("<i class='fa-solid fa-comment text-green-500'></i>");
          if (cardData.label) icons.push("<i class='fa-solid fa-tag text-yellow-500'></i>");
          if (cardData.file) icons.push("<i class='fa-solid fa-paperclip text-gray-500'></i>");

          card.innerHTML = `
            <div class="flex justify-between items-center">
              <strong>${cardData.text}</strong>
              <div class="flex gap-2">${icons.join(" ")}</div>
            </div>
            ${cardData.label ? `<span class="inline-block w-4 h-4 mt-2 rounded" style="background:${cardData.label}"></span>` : ""}
            ${cardData.comment ? `<div class="text-sm mt-2">${cardData.comment}</div>` : ""}
          `;

          columns[column].appendChild(card);
        });

        const titleMap = {
          todo: "A Fazer",
          inProgress: "Em Progresso",
          done: "Concluído"
        };
        const count = list.length;
        document.querySelector(`[data-column="${column}"] h2`).textContent =
          `${titleMap[column]} · ${count} item${count !== 1 ? "s" : ""}`;
      });
    }

    document.getElementById("projectSelect").addEventListener("change", async (e) => {
      currentProject = e.target.value;
      document.getElementById("userName").textContent = `Projeto: ${allProjects[currentProject].name}`;
      renderCards();
    });

   async function createNewProject() {
      const name = prompt("Nome do novo quadro:");
      if (!name) return;
      try {
        await fetch("/api/projects", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        await loadProjects();
        renderCards();
      } catch (err) {
        console.error("Erro ao criar projeto:", err);
      }
    }

    async function renameProject() {
      const name = prompt("Novo nome para o quadro:");
      if (!name) return;
      try {
        await fetch(`/api/projects/${currentProject}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        await loadProjects();
        renderCards();
      } catch (err) {
        console.error("Erro ao renomear projeto:", err);
      }
    }

    async function deleteProject() {
      const confirmDelete = confirm("Tem certeza que deseja excluir este quadro?");
      if (!confirmDelete) return;
      try {
        await fetch(`/api/projects/${currentProject}`, {
          method: "DELETE"
        });
        await loadProjects();
        renderCards();
      } catch (err) {
        console.error("Erro ao excluir projeto:", err);
      }
    }

    async function addCard(column) {
      const text = prompt("Texto do novo cartão:");
      if (!text) return;
      try {
        await fetch(`/api/projects/${currentProject}/cards`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ column, text })
        });
        await loadProjects();
        renderCards();
      } catch (err) {
        console.error("Erro ao adicionar cartão:", err);
      }
    }

    function logout() {
      fetch("/api/logout").then(() => {
        location.reload();
      });
    }
  </script>
</body>
</html>
