<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Login - Mini Trello</title>
  <meta name="description" content="Acesse seus quadros pessoais estilo Trello" />
  <meta name="author" content="Bruno" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Ícone e PWA -->
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0077cc" />

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Botão tema -->
  <button onclick="toggleTheme()" class="theme-button">🌙 Tema</button>

  <!-- Avatar (se logado previamente) -->
  <div id="avatar">?</div>

  <header>
    <h1>Mini Trello</h1>
  </header>

  <main>
    <section class="login-section">
      <form id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Usuário" required />
        <input type="password" id="password" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      <div id="loginStatus"></div>
    </section>
    <p style="text-align:center;">
      <a href="register.html">→ Não tem conta? Cadastre-se</a>
    </p>
  </main>

  <script>
    // Tema escuro
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const theme = document.body.classList.contains("dark-mode") ? "dark" : "light";
      localStorage.setItem("theme", theme);
    }

    // Carrega tema e avatar
    window.onload = () => {
      const theme = localStorage.getItem("theme");
      if (theme === "dark") document.body.classList.add("dark-mode");

      fetch("/get-user")
        .then(res => res.json())
        .then(data => {
          if (data.username) {
            const avatar = document.getElementById("avatar");
            avatar.textContent = data.username.charAt(0).toUpperCase();
            avatar.title = data.username;
          } else {
            document.getElementById("avatar").style.display = "none";
          }
        });
    };

    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      const status = document.getElementById("loginStatus");
      status.textContent = data.message;
      status.style.color = data.success ? "green" : "red";

      if (data.success) {
        setTimeout(() => window.location.href = "board.html", 1000);
      }
    });
  </script>
</body>
</html>
